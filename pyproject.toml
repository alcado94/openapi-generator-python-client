[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-modular-cli"
version = "0.1.0"
description = "CLI reutilizable para generar SDKs Python instalables mediante extras por tag"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1"]

[project.scripts]
openapi-modular = "openapi_modular_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openapi_modular_cli = ["templates/runtime/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
